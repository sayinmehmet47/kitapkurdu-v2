name: Deploy test

# Manual, approval-gated deploy of `main` to the hosted test site.
# The `test` environment requires the repository owner's approval before this
# job starts, and only that environment holds CLOUDFLARE_API_TOKEN. The token is
# passed only to the migration and deploy steps, never to `npm ci`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy main to test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: test
      url: https://kitapkurdu.kigx.xyz
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # The CI workflow already ran the full suite (including browsers) on main.
      - name: Quick checks before touching the hosted environment
        run: |
          npm run check
          npm run typecheck
          npm test
      - name: Apply reviewed D1 migrations to the test database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:test
      - name: Build for test and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:test
      - name: Smoke check the hosted site
        run: |
          for path in / /books /sign-in; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "https://kitapkurdu.kigx.xyz$path")
            echo "$path -> $code"
            test "$code" = 200
          done
